<!DOCTYPE html>
<html lang="{{ current_lang|default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduSmartBot{% endblock %}</title>
    <meta name="theme-color" content="#0d6efd">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-brain me-2"></i>EduSmartBot
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="fas fa-home me-1"></i> <span data-i18n="nav.home">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/web-scraper' %}active{% endif %}" href="/web-scraper">
                            <i class="fas fa-globe me-1"></i> <span data-i18n="nav.web_scraper">Web Scraper</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/ocr' %}active{% endif %}" href="/ocr">
                            <i class="fas fa-file-alt me-1"></i> <span data-i18n="nav.ocr">OCR</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/chatbot' %}active{% endif %}" href="/chatbot">
                            <i class="fas fa-comments me-1"></i> <span data-i18n="nav.chatbot">Chatbot</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/quiz' %}active{% endif %}" href="/quiz">
                            <i class="fas fa-question-circle me-1"></i> <span data-i18n="nav.quiz">Quiz</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/timetable' %}active{% endif %}" href="/timetable">
                            <i class="fas fa-calendar-alt me-1"></i> <span data-i18n="timetable">Timetable</span>
                        </a>
                    </li>
                    
 
                    <li class="nav-item d-flex align-items-center ms-2">
                        <button id="theme-toggle" class="btn btn-sm btn-outline-light" type="button" aria-label="Toggle theme">
                            <i class="fas fa-moon"></i>
                        </button>
                    </li>
                    <li class="nav-item d-flex align-items-center ms-2">
                        <select id="language-select" class="form-select form-select-sm" style="width:auto">
                            <option value="en" {% if current_lang=='en' %}selected{% endif %}>English</option>
                            <option value="hi" {% if current_lang=='hi' %}selected{% endif %}>हिन्दी</option>
                        </select>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Back to top button -->
    <button type="button" class="btn btn-primary position-fixed" id="back-to-top" aria-label="Back to top" style="right: 18px; bottom: 18px; display:none; z-index:1070;">
        <i class="fa fa-arrow-up"></i>
    </button>

    <!-- Footer -->
    <footer class="footer mt-auto py-3">
        <div class="container text-center">
            <span>&copy; 2025 EduSmartBot • AI-Powered Education Tool</span>
        </div>
    </footer>

    <!-- Toasts container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080">
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    
    {% block extra_js %}{% endblock %}
    <script>
    (function(){
        const btn = document.getElementById('back-to-top');
        if (!btn) return;
        const onScroll = () => {
            if (window.scrollY > 300) btn.style.display = 'inline-flex';
            else btn.style.display = 'none';
        };
        window.addEventListener('scroll', onScroll);
        btn.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();
    </script>
</body>
</html>
